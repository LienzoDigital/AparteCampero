<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Tiempos - Aparte Campero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/favicon.ico">
    <style>
        .icon-svg {
            width: 1em;
            height: 1em;
            vertical-align: middle;
            margin-right: 0.3em;
            fill: currentColor;
        }
        
        .btn-menu img.icon-svg {
            margin-right: 8px;
        }
        
        .theme-switcher img.icon-svg {
            margin-right: 0;
        }
        
        .btn-purple {
            background-color: #6f42c1;
            color: white;
        }
        
        .btn-purple:hover {
            background-color: #5e35b1;
            color: white;
        }
        
        .btn-secondary{
            background-color: rgb(124, 97, 62);
            color:white;
        }

        .btn-secondary:hover{
            background-color: rgb(194, 158, 111);
            color: rgb(88, 88, 88);
        }
        .main-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .btn-menu {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        
        .btn-menu:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        @media (max-width: 768px) {
            .main-menu {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="light-theme">
    <header>
        <img src="assets/logo.svg" alt="Logo Aparte Campero" class="logo">
        <div class="theme-switcher">
            <button id="themeToggle" class="btn btn-sm btn-outline-secondary" title="Cambiar tema">
                <img src="img/moon.svg" alt="Tema oscuro" class="icon-svg">
            </button>
            <button id="viewToggle" class="btn btn-sm btn-outline-primary" title="Cambiar vista">
                <img src="img/phone.svg" alt="Vista móvil" class="icon-svg">
            </button>
        </div>
    </header>

    <main class="container">
        <h1 class="text-center">Registro de Tiempos<br><span>Aparte Campero</span></h1>
        
        <div class="main-menu">
            <a href="new-event.html" class="btn-menu btn-danger">
                <img src="img/trash.svg" alt="Nuevo evento" class="icon-svg">
                <span>Nuevo Evento</span>
            </a>
            <a href="teams.html" class="btn-menu btn-primary">
                <img src="img/people.svg" alt="Equipos" class="icon-svg">
                <span>ABM de Equipos</span>
            </a>
            <a href="register-time.html" class="btn-menu btn-success">
                <img src="img/stopwatch.svg" alt="Registro" class="icon-svg">
                <span>Registro de Tiempos</span>
            </a>
            <a href="capture-time.html" class="btn-menu btn-info">
                <img src="img/play-circle.svg" alt="Tomar tiempos" class="icon-svg">
                <span>Toma de Tiempos</span>
            </a>
            <a href="edit-times.html" class="btn-menu btn-warning">
                <img src="img/pencil.svg" alt="Editar" class="icon-svg">
                <span>Editar Tiempos</span>
            </a>
            <a href="results.html" class="btn-menu btn-purple">
                <img src="img/trophy.svg" alt="Resultados" class="icon-svg">
                <span>Resultados</span>
            </a>
            <a href="export-data.html" class="btn-menu btn-secondary">
                <img src="img/download.svg" alt="Exportar" class="icon-svg">
                <span>Exportar Datos</span>
            </a>
        </div>
    </main>

    <footer class="text-center mt-4 py-3">
        <p>Sistema de Registro - Aparte Campero © 2025</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>

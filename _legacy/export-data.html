<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exportar Datos - Aparte Campero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../assets/favicon.ico">
</head>
<body class="light-theme">
    <header>
        <img src="assets/logo.svg" alt="Logo Aparte Campero" class="logo">
        <div class="theme-switcher">
            <button id="themeToggle" class="btn btn-sm btn-outline-secondary" title="Cambiar tema">
                <img src="img/moon.svg" alt="Tema oscuro" class="icon-svg">
            </button>
            <button id="viewToggle" class="btn btn-sm btn-outline-primary" title="Cambiar vista">
                <img src="img/phone.svg" alt="Vista móvil" class="icon-svg">
            </button>
        </div>
    </header>

    <main class="container fade-in">
        <a href="../index.html" class="btn btn-secondary mb-3">
            <img src="img/arrow-left.svg" alt="volver al menu" class="icon-svg"> Volver al Menú
        </a>
        
        <h2><img src="img/download.svg" class="icon-svg">  Exportar Datos</h2>
        
        <div class="card p-3 mb-4">
            <div class="d-grid gap-3">
                <button id="exportTxtBtn" class="btn btn-primary btn-lg">
                    <img src="img/download.svg" class="icon-svg">  Exportar a TXT
                </button>
                <button id="exportEmailBtn" class="btn btn-success btn-lg">
                    <img src="img/envelope.svg" class="icon-svg">  Enviar por Email
                </button>
            </div>
        </div>
        
        <div class="card p-3">
            <h5 class="card-title">Vista previa de datos</h5>
            <pre id="dataPreview" class="p-3 bg-light rounded"></pre>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/export.js"></script>
</body>
</html>

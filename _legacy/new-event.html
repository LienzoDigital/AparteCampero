<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Evento - Aparte Campero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-3">
        <button id="backBtn" class="btn btn-secondary mb-3">Volver al Menú</button>
        <h2>Nuevo Evento</h2>
        
        <div class="alert alert-warning">
            <p>¿Está seguro que desea iniciar un nuevo evento? Esto borrará todos los datos almacenados.</p>
            <button id="confirmNewEvent" class="btn btn-danger">Confirmar Nuevo Evento</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        document.getElementById('confirmNewEvent').addEventListener('click', () => {
            // Borrar todos los datos del localStorage
            localStorage.removeItem('camperoTeams');
            localStorage.removeItem('camperoTimes');
            
            alert('Todos los datos han sido borrados. Se creará un nuevo evento.');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>

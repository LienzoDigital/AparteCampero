<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABM de Equipos - Aparte Campero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="../assets/favicon.ico">
</head>
<body class="light-theme">
    <header>
        <img src="assets/logo.svg" alt="Logo Aparte Campero" class="logo">
        <div class="theme-switcher">
            <button id="themeToggle" class="btn btn-sm btn-outline-secondary" title="Cambiar tema">
                <img src="img/moon.svg" alt="Tema oscuro" class="icon-svg">
            </button>
            <button id="viewToggle" class="btn btn-sm btn-outline-primary" title="Cambiar vista">
                <img src="img/phone.svg" alt="Vista móvil" class="icon-svg">
            </button>
        </div>
    </header>

    <main class="container fade-in">
        <a href="../index.html" class="btn btn-secondary mb-3">
            <img src="img/arrow-left.svg" alt="volver al menu" class="icon-svg"> Volver al Menú
        </a>
        
        <h2><img src="img/people.svg" class="icon-svg"> Administración de Equipos</h2>
        
        <div class="card p-3 mb-4">
            <form id="teamForm" class="row g-3">
                <div class="col-md-6">
                    <label for="teamName" class="form-label">Nombre del Equipo</label>
                    <input type="text" class="form-control" id="teamName" required>
                </div>
                <div class="col-md-4">
                    <label for="teamNumber" class="form-label">Número del Equipo</label>
                    <input type="number" class="form-control" id="teamNumber" min="1" required>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">
                        <img src="img/plus.svg" alt="agregar" class="icon-svg"> Agregar
                    </button>
                </div>
            </form>
        </div>
        
        <div class="card p-3">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Número</th>
                            <th>Nombre</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="teamsTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/teams.js"></script>
</body>
</html>

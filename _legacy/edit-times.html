<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Tiempos - Aparte Campero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../assets/favicon.ico">
</head>
<body class="light-theme">
    <header>
        <img src="assets/logo.svg" alt="Logo Aparte Campero" class="logo">
        <div class="theme-switcher">
            <button id="themeToggle" class="btn btn-sm btn-outline-secondary" title="Cambiar tema">
                <img src="img/moon.svg" alt="Tema oscuro" class="icon-svg">
            </button>
            <button id="viewToggle" class="btn btn-sm btn-outline-primary" title="Cambiar vista">
                <img src="img/phone.svg" alt="Vista móvil" class="icon-svg">
            </button>
        </div>
    </header>

    <main class="container fade-in">
        <a href="../index.html" class="btn btn-secondary mb-3">
            <img src="img/arrow-left.svg" alt="volver al menu" class="icon-svg"> Volver al Menú
        </a>
        
        <h2><img src="img/pencil-square.svg" class="icon-svg">  Editar Tiempos</h2>
        
        <div class="card p-3 mb-3">
            <div class="mb-3">
                <label for="editTeamSelect" class="form-label">Seleccionar Equipo</label>
                <select class="form-select" id="editTeamSelect">
                    <option value="">Seleccionar equipo</option>
                </select>
            </div>
        </div>
        
        <div class="card p-3" id="timesContainer" style="display: none;">
            <h5 class="mb-3">Tiempos del Equipo</h5>
            <div id="teamTimesList"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/edit.js"></script>
</body>
</html>
